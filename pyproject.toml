[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# "showrun" is already reserved on PyPI; the command and import name stay `showrun`.
name = "showrun-cli"
dynamic = ["version"]
description = "Scripted, keypress-driven terminal demos: record once, present with Enter, replay offline."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anand Rao", email = "anand@clue2solve.com" }]
keywords = ["demo", "terminal", "presentation", "cli", "asciinema", "live-coding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
    "Topic :: Terminals",
]
dependencies = [
    "rich>=13",
    "typer>=0.9",
    "pexpect>=4.8",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/clue2solve/showrun"
Source = "https://github.com/clue2solve/showrun"
Issues = "https://github.com/clue2solve/showrun/issues"

[project.scripts]
showrun = "showrun.cli:app"

[tool.hatch.version]
path = "src/showrun/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/showrun"]

[tool.hatch.build.targets.sdist]
include = ["src/showrun", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

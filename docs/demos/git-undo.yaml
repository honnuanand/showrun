# A short CLI how-to: undo the last git commit but keep the changes.
# Present it:  showrun play docs/demos/git-undo.yaml
title: "How-to: undo your last git commit"

settings:
  prompt: "[bold green]dev@laptop[/] [bold blue]{cwd}[/] [bold]$[/] "
  typing_speed: 0.035
  typo_rate: 0.01
  env:
    GIT_AUTHOR_NAME: Demo
    GIT_AUTHOR_EMAIL: demo@example.com
    GIT_COMMITTER_NAME: Demo
    GIT_COMMITTER_EMAIL: demo@example.com

vars:
  repo: /tmp/showrun-git-howto

setup:
  - rm -rf {{repo}} && mkdir -p {{repo}} && cd {{repo}} && git init -q -b main
  - cd {{repo}} && echo "v1" > app.txt && git add app.txt && git commit -qm "Add app"
  - 'cd {{repo}} && echo "debug=true" > secrets.env && git add . && git commit -qm "Oops: commit secrets.env"'

cleanup:
  - rm -rf {{repo}}

steps:
  - run: cd {{repo}}
    hidden: true

  - title: Undo the last commit, keep the changes
    say: You just committed a file you didn't mean to. Look at the history first.
    run: git log --oneline
    highlight: ["Oops.*"]

  - say: "--soft moves the branch back one commit and leaves your changes staged."
    run: git reset --soft HEAD~1
    notes: Contrast with --hard, which throws the changes away.

  - run: git log --oneline

  - say: The file is still here, staged and ready to fix.
    run: git status --short
    highlight: ["secrets.env"]

  - say: Unstage it, ignore it, and commit what you meant to.
    run: git restore --staged secrets.env && echo secrets.env >> .gitignore && git add .gitignore && git commit -qm "Ignore secrets.env" && git log --oneline
    expect_output: Ignore secrets.env
